/* Classroom visual theme. Keep task content, graph colors and behavior intact. */
@media screen {
  :root {
    --ink:#183338;
    --muted:#52696e;
    --green:#145d58;
    --green2:#e8f4f1;
    --paper:#f3f6f8;
    --line:#d6e2e5;
    --shadow:0 3px 14px #18333805, 0 1px 2px #18333804;
  }
  body { font-size:16px; line-height:1.7; }
  h1 { font-size:40px; line-height:1.4; letter-spacing:-.8px; }
  h2 { font-size:28px; line-height:1.45; letter-spacing:-.4px; }
  h3 { font-size:20px; line-height:1.5; }
  h4 { font-size:16px; line-height:1.6; }
  .small { font-size:14px; }
  .eyebrow { font-size:12px; letter-spacing:1.6px; }
  .tag { padding:4px 10px; border-radius:6px; font-size:12px; line-height:1.6; }
  .tag.gray { color:#52656b; background:#edf2f4; }
  .chip { color:#52696e; background:#edf2f4; font-size:12px; border-radius:6px; }
  .line { margin:20px 0; }
  .stack { gap:18px; }
  .grid2,.grid3,.info-pair { gap:20px; }
  .grid2>*,.grid3>*,.info-pair>*,.teacher-grid>*,.teacher-summary>* { min-width:0; }

  /* Controls retain their existing primary, disabled and selected semantics. */
  button { min-height:44px; padding:10px 18px; border-radius:10px; font-weight:500; transition:background-color .15s,border-color .15s,box-shadow .15s; }
  button:hover:not(:disabled) { background:#f0f7f6; border-color:#6e9995; }
  button.primary { box-shadow:0 2px 4px #145d5815; }
  button.primary:hover:not(:disabled) { background:#104e49; border-color:#104e49; }
  button:disabled { opacity:1; color:#65777d; background:#edf2f4; border-color:#dce5e8; box-shadow:none; }
  button.primary:disabled { color:#526e6b; background:#e0ece9; border-color:#cdded9; }
  button.small { min-height:38px; padding:7px 12px; font-size:14px; }
  button.ghost { box-shadow:none; }
  button:focus-visible,a:focus-visible,summary:focus-visible { outline:3px solid #bc843c; outline-offset:3px; }
  label { font-size:14px; line-height:1.6; margin-bottom:8px; }
  input,select,textarea { border-color:#c7d7dc; border-radius:10px; padding:11px 12px; font-size:15px; }
  input,select { min-height:44px; }
  input::placeholder,textarea::placeholder { color:#6d8085; opacity:1; }
  input:focus,select:focus,textarea:focus { outline:2px solid #82b6af; outline-offset:2px; border-color:var(--green); }
  input[type=radio],input[type=checkbox] { min-height:0; flex-shrink:0; width:16px; height:16px; }
  .radio-card { padding:16px; border-radius:12px; font-size:15px; line-height:1.7; transition:border-color .15s,background-color .15s; }
  .radio-card:hover { border-color:#85a9a4; background:#f8fbfa; }
  .radio-card:has(input:checked) { border-color:var(--green); background:var(--green2); box-shadow:inset 3px 0 var(--green); }

  /* The page shell establishes one clear primary navigation level. */
  .topbar { height:76px; padding:0 32px; box-shadow:0 1px 4px #18333803; }
  .brand { letter-spacing:.5px; gap:12px; }
  .brand-icon { width:38px; height:38px; border-radius:12px; color:#e0f3ee; box-shadow:0 3px 8px #145d5817; }
  .top-meta { font-size:14px; }
  .landing { max-width:1200px; margin:40px auto; }
  .hero { grid-template-columns:1.16fr 1fr; border-radius:24px; box-shadow:0 12px 40px #18333808; }
  .hero-copy { padding:42px; }
  .hero-copy .eyebrow { display:inline-block; background:var(--green2); padding:5px 10px; border-radius:6px; margin-bottom:20px; }
  .hero-copy>p { font-size:16px; }
  .hero-stats { margin:26px 0; gap:28px; }
  .hero-stats>div { padding-right:26px; }
  .big-number { font-size:38px; font-variant-numeric:tabular-nums; margin-bottom:5px; color:#244b50; }
  .login-grid { gap:14px; }
  .login-grid button { min-height:48px; margin-top:3px; font-size:16px; }
  .hero-image .image-caption { padding:20px 22px; border:1px solid #ffffff91; background:#f7fbf7f2; box-shadow:0 4px 20px #153e3c0d; }
  .image-caption .eyebrow { margin-bottom:8px; }
  .image-caption>b { font-size:18px; }
  .landing-foot { font-size:13px; padding:0 4px; }
  .progress-nav { max-width:1600px; gap:12px; margin:24px auto; }
  .step { padding:14px 18px; gap:12px; border-radius:12px; background:#fff; font-size:16px; font-weight:600; box-shadow:0 1px 2px #18333803; }
  .step .num { width:34px; height:34px; font-size:14px; background:#edf3f4; color:#52696e; }
  .step small { font-size:12px; opacity:1; color:var(--muted); margin-top:2px; }
  .step.active { background:var(--green); border-color:var(--green); box-shadow:0 4px 12px #145d581a; }
  .step.active:hover:not(:disabled) { background:#104e49; border-color:#104e49; }
  .step.active .num { background:#ffffff24; color:#fff; }
  .step.active small { color:#d8eeea; }
  .step:disabled { background:#edf2f4; border-style:dashed; }
  .step:disabled .num { background:#e3eaed; color:#65777d; }
  .workspace { max-width:1600px; grid-template-columns:minmax(0,1fr) 304px; gap:24px; padding-top:0; }
  .workspace.collapsed { grid-template-columns:minmax(0,1fr) 60px; }
  .main-column { gap:20px; }
  .stage-heading { padding:4px 0 6px; }
  .stage-heading .eyebrow { margin-bottom:7px; }
  .stage-heading h2 { margin-bottom:0; }
  .stage-foot { padding:16px 0; }
  .card { border-radius:16px; padding:24px; border-color:#dce6e9; }
  .section-label { gap:12px; }
  .section-label .index { padding:4px 10px; border-radius:6px; }
  .soft { background:#f0f6f6; border-radius:12px; padding:18px; }
  .notice { font-size:14px; border-radius:0 10px 10px 0; line-height:1.75; }
  .success,.error { font-size:14px; border-radius:10px; padding:14px 16px; }
  details { background:#f7fafb; border-radius:12px; padding:14px 16px; }
  summary { font-size:14px; color:#294e54; line-height:1.6; }
  details[open]>summary { margin-bottom:10px; }
  details p { font-size:14px; line-height:1.75; }
  .formula { padding:16px 18px; border-radius:12px; background:#f2f7f8; border-color:#d6e5e8; font-size:16px; line-height:1.85; }
  .checks { font-size:14px; gap:16px; }

  /* Tables and calculations share a quiet, consistent evidence surface. */
  table { font-size:14px; font-variant-numeric:tabular-nums; }
  td,th { padding:11px 12px; border-color:#e1e9ec; }
  th { background:#edf4f5; color:#35565d; font-size:13px; font-weight:600; }
  tbody tr:nth-child(even) { background:#fafcfd; }
  tbody tr:hover { background:#f2f8f7; }
  table input,table select { min-height:38px; font-size:14px; }
  .table-scroll { border:1px solid #e0e8eb; border-radius:10px; }
  .data-table th { z-index:1; }
  .center-fields { gap:14px; }
  .center-fields label { font-size:14px; }
  .center-result { background:#f7fafb; border-radius:12px; padding:18px; }
  .correct-coordinate { font-size:17px; }
  .mean-work { font-size:14px; line-height:1.9; }
  .metric { background:#f0f5f7; border:1px solid #e1e9ed; border-radius:12px; padding:15px 16px; }
  .metric .label { font-size:13px; margin-bottom:5px; }
  .metric .value { font-size:28px; letter-spacing:-.3px; }
  .metric b { font-size:15px; }
  .sse-summary .value { font-size:26px; }
  .scale-activity { background:#f5faf9; border-color:#cbded9; }
  .scale-activity caption { font-size:13px; padding-bottom:8px; }
  .scale-result { padding:16px; border-radius:12px; }
  .scale-result.nearest { background:#eaf5f1; box-shadow:inset 3px 0 var(--green); }
  .scale-equation { font-size:16px; line-height:1.8; }
  #scaleReason { padding:16px 18px; background:#f0f6f6; border-left:3px solid #438b81; border-radius:0 10px 10px 0; }
  #scaleReason h4 { margin-bottom:6px; }
  #scaleReason p { font-size:14px; }
  #scaleReason p:last-child { margin-bottom:0; }

  /* The graph, controls and observation panel read as one experiment area. */
  .lab-roadmap { background:#e9f0f3; border-color:#d8e4e8; border-radius:14px; padding:16px; }
  .lab-roadmap .eyebrow { color:#52696e; font-size:12px; margin-bottom:12px; }
  .lab-tabs { gap:10px; }
  .lab-tabs button { padding:12px 14px; font-size:14px; background:#fff; border-color:#d6e2e5; }
  .lab-tabs button.active { color:#104e49; background:#e1f0ec; border-color:#86b5aa; box-shadow:inset 0 -3px var(--green); }
  .lab-tabs button:disabled { color:#65777d; background:#f0f4f6; border-style:dashed; }
  .lab-tabs small { font-size:12px; opacity:1; }
  .lab-main h3 { font-size:21px; }
  .lab-scene-layout { grid-template-columns:minmax(0,1fr) 228px; gap:20px; margin-top:20px; }
  .lab-scene-layout aside { gap:12px; }
  .scene-toolbar { margin-bottom:10px; min-height:38px; }
  .scene-toolbar .small { font-size:13px; }
  .lab3d { border-color:#cfdee2; border-radius:14px; background:#f0f6f5; height:440px; }
  .chart { border:1px solid #e0e8eb; border-radius:12px; background:#fff; }
  .canvas-caption { font-size:13px; margin-top:9px; }
  .legend { font-size:13px; gap:16px; }
  .plot-tooltip { background:#edf5f3; font-size:14px; padding:12px 14px; border-radius:10px; }
  .scene-label { background:#f8fcf6ed; }
  .lab-actions { gap:10px; padding:20px 0 16px; }
  .lab-actions button { font-size:14px; }
  .simulation-prompt { background:#edf6f2; border-color:#d0e3db; padding:16px; }
  .simulation-prompt select { font-size:14px; }
  #labMetrics { gap:10px; }
  #labMetrics .value { font-size:24px; }
  #labMetrics .metric { padding:14px 16px; }
  #labNarration { min-height:58px; display:flex; align-items:center; background:#edf5f7; border-left-color:#548c99; color:#2b515c; padding:14px 16px; }
  #labProjection { font-size:13px; color:var(--muted); }
  #labProjection select { font-size:14px; }
  .controls label { font-size:14px; }
  .controls select,.controls input { padding:9px 12px; }
  .lab-inspection { margin-top:24px; }

  /* The tutor stays available without competing with the main task. */
  .tutor { border-color:#d1e0e3; border-radius:16px; box-shadow:0 4px 20px #18333806; }
  .tutor-header { padding:16px; background:#eaf3f2; border-bottom-color:#d4e4e1; }
  .tutor-title>b { font-size:16px; color:#204e4c; }
  .tutor-role { font-size:12px; color:#496965; margin-top:4px; line-height:1.6; }
  .tutor-header button { font-size:20px; min-width:36px; padding:2px 8px; }
  .tutor-body { padding:16px; min-height:132px; max-height:400px; }
  .bubble { padding:14px; border-radius:3px 12px 12px 12px; background:#f0f5f6; font-size:14px; line-height:1.8; margin-bottom:12px; }
  .bubble:last-child { margin-bottom:0; }
  .bubble.user { background:var(--green); border-radius:12px 3px 12px 12px; margin-left:16px; }
  .bubble-source { font-size:12px; color:#52696e; margin-bottom:6px; }
  .tutor-bottom { padding:16px; border-color:#e0e9eb; }
  .tutor-bottom textarea { min-height:80px; font-size:14px; }
  .quick-questions { gap:8px; margin:0 0 14px; }
  .quick-questions button { min-height:34px; padding:6px 10px; font-size:12px; border-radius:8px; color:#3c5e62; }
  .model-status { font-size:12px; }
  .tutor.collapsed .tutor-header { padding:8px; }

  /* Project evidence, reflection and teacher review use the same vocabulary. */
  .project-summary { gap:24px; }
  .project-k { background:#e8f4f0; border:1px solid #c8e0d6; padding:20px; border-radius:14px; }
  .project-k strong { font-size:34px; }
  .reflection-option { font-size:15px; padding:14px 16px; margin:10px 0; }
  .reflection-form fieldset { margin:24px 0; }
  .reflection-form legend { font-size:17px; }
  .distance-chips span { background:#f4f8f9; border-color:#d7e4e8; font-size:15px; border-radius:10px; font-variant-numeric:tabular-nums; }
  .reflection-focus select { font-size:15px; }
  .reflection-feedback-grid { gap:20px; }
  .reflection-next { background:#edf6f3; border-radius:0 12px 12px 0; }
  .evidence-list { font-size:14px; line-height:1.75; }
  .teacher { max-width:1550px; margin-top:28px; }
  .teacher-grid { grid-template-columns:308px minmax(0,1fr); gap:24px; }
  .teacher-summary { gap:14px; }
  .teacher-summary .metric { box-shadow:var(--shadow); }
  .teacher-code { font-size:38px; letter-spacing:4px; font-variant-numeric:tabular-nums; }
  .teacher .list-controls { flex-wrap:wrap; gap:10px; }
  .record-item { border-radius:12px; padding:18px; background:#fff; }
  .review-fields select { font-size:14px; }
  .rubric-item { font-size:13px; border-radius:12px; background:#f8fafb; }
  .student-detail { background:#f5f8fa; }
  .teacher .reflection-answer { background:#f0f5f6; }
  .progress-track { height:7px; background:#e4edf0; }
  .teacher.projector { font-size:20px; }
  .teacher.projector .teacher-grid { grid-template-columns:1fr; }
  .teacher.projector .small,.teacher.projector .metric .label,.teacher.projector th,.teacher.projector td { font-size:18px; }
  .teacher.projector h3 { font-size:24px; }
  .teacher.projector .metric .value { font-size:44px; }
  .teacher.projector .metric b { font-size:22px; }
  .footer-note { font-size:12px; }
  #toast { font-size:14px; background:#204b49; border:1px solid #ffffff1f; }
}

@media screen and (min-width:1550px) {
  .workspace { grid-template-columns:minmax(0,1fr) 320px; }
  .lab-scene-layout { grid-template-columns:minmax(0,1fr) 250px; }
  .lab3d { height:470px; }
}
@media screen and (max-width:1200px) {
  .lab-scene-layout { grid-template-columns:1fr; }
  .lab-scene-layout aside { grid-template-columns:1fr 1fr; }
  .lab3d { height:420px; }
  .lab-tabs { gap:8px; }
  .lab-tabs button { padding:11px 10px; font-size:13px; }
  .hero-copy { padding:32px; }
  h1 { font-size:36px; }
}
@media screen and (max-width:1150px) {
  .workspace { grid-template-columns:minmax(0,1fr) 272px; padding:0 20px 28px; gap:18px; }
  .progress-nav { padding:0 20px; gap:10px; }
  .step { padding:12px; gap:9px; font-size:15px; }
  .card { padding:20px; }
  .teacher-grid { grid-template-columns:260px minmax(0,1fr); gap:18px; }

}
@media screen and (max-width:800px) {
  .hero { grid-template-columns:1fr; }
  .hero-image { min-height:250px; }
  .hero-copy { padding:28px; }
  h1 { font-size:32px; }
  h2 { font-size:25px; }
  .landing { margin:24px auto; padding:0 20px; }
  .workspace,.workspace.collapsed { grid-template-columns:1fr; }
  .progress-nav { margin:18px auto; }
  .step { gap:8px; padding:10px; font-size:14px; }
  .step .num { width:28px; height:28px; font-size:13px; }
  .step small { font-size:11px; }
  .tutor { position:static; max-height:none; }
  .teacher-grid { grid-template-columns:1fr; }
  .teacher { padding:0 20px; }
  .main-column { gap:18px; }
}
@media screen and (max-width:650px) {
  .topbar { height:auto; min-height:72px; padding:14px 16px; gap:10px 16px; flex-wrap:wrap; }
  .brand { font-size:15px; gap:9px; }
  .brand .small { font-size:12px; }
  .brand-icon { width:33px; height:33px; border-radius:10px; }
  .top-meta { gap:8px; margin-left:auto; }
  .top-meta .tag { font-size:11px; }
  .top-meta a { font-size:13px; }

  .hero { border-radius:18px; }
  .hero-image { min-height:220px; }
  .hero-image .image-caption { left:16px; right:16px; bottom:16px; padding:14px 16px; }
  .hero-copy { padding:24px; }
  h1 { font-size:29px; letter-spacing:-.6px; }
  .hero-copy .eyebrow { font-size:10px; letter-spacing:1px; padding:5px 8px; }
  .hero-stats { gap:18px; }
  .hero-stats>div { padding-right:18px; }
  .big-number { font-size:32px; }
  .hero-stats .small { font-size:12px; }
  .progress-nav { padding:0 16px; gap:8px; }
  .workspace { padding:0 16px 24px; }
  .card { padding:18px; border-radius:14px; }
  .stage-heading h2 { font-size:24px; }
  .lab-main h3 { font-size:19px; }
  .lab-roadmap { padding:12px; }
  .stage-foot { align-items:flex-start; flex-wrap:wrap; }
  .scene-toolbar { gap:8px; }
  .scene-toolbar .small { font-size:12px; }
  .lab3d { height:350px; }
  .lab-actions { gap:8px; }
  .lab-actions button { font-size:13px; padding:10px 12px; }
  .table-scroll td,.table-scroll th { padding:10px; }
  .project-summary { gap:16px; }
  .project-k { padding:16px; }
  .project-k strong { font-size:30px; }
  .reflection-option { font-size:14px; padding:12px; }
  .reflection-form legend { font-size:16px; }
  .reflection-focus select { font-size:13px; }
  .distance-chips { gap:8px; }
  .distance-chips span { font-size:14px; padding:8px 12px; }
  .teacher { padding:0 16px; margin-top:20px; }
  .teacher-summary { gap:10px; }
  .teacher-summary .metric { padding:13px; }
}
@media screen and (max-width:600px) {
  .progress-nav { grid-template-columns:1fr 1fr; }
  .step { padding:12px; font-size:14px; }

</script><script>/* Guided experiments. All numerical results are computed by KM, including 5-D distances. */
window.ClassroomLab={create(io){
  const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=(n,p=3)=>Number(n.toFixed(p)).toLocaleString('en-US',{maximumFractionDigits:p});
  const colors=['#177e89','#d78149','#8b69ad','#ae9b38','#4378af','#bf607a'];
  const steps=[['模拟过程','逐步模拟聚类'],['增加特征','从二维到五维'],['比较起点','换起点，结果会变吗？'],['选择 K','分几组更合适？']];
  let view=null,timer=null,busy=false,cache=null;
  const student=()=>io.read().student;
  const state=()=>io.read().draft.lab;
  function init(){
    const d=io.read().draft;
    d.lab=d.lab||{version:3,step:0,frame:-1,params:{...KM.LAB_BASE},selected:9,axes:[0,1,2],simulation:{frames:[],attempts:[]}};
    const l=d.lab;
    if(!l.version){
      if(l.step===0&&l.params.dims===3){l.previousSimulation={params:{...l.params},frame:l.frame,simulation:JSON.parse(JSON.stringify(l.simulation||{}))};l.params={...KM.LAB_BASE};l.frame=-1;l.simulation={frames:[],attempts:[]};}
      l.version=2;
    }
    if(l.version<3){
      const previousComparison=l.step>=2||student().experiments.some(x=>x.dims===5&&x.seed!==1)||student().records.elbow?.dims===5;
      if(previousComparison){
        l.previousComparison={step:l.step,params:{...l.params},frame:l.frame,observation:d.observation,reason:d.reason,k:d.k};
        if(!student().completed[2]){d.observation='';d.reason='';}
      }
      if(l.step>=2){l.params={...KM.LAB_BASE,dims:3};l.frame=-1;l.axes=[0,1,2];}
      l.version=3;
    }
    l.simulation||={frames:[],attempts:[]};
    const step=Math.min(l.step,student().completed[2]?3:KM.labProgress(student()).available);
    if(step!==l.step){l.step=step;l.params={...KM.LAB_BASE,dims:step>=2?3:2};l.frame=-1;l.axes=[0,1,2];}
  }
  function save(){io.save();}
  function run(){const p=state().params,key=JSON.stringify(p);if(cache?.key!==key)cache={key,...KM.run(KM.prepare(p.dims,p.mode).points,p.k,p.seed)};return cache;}
  function frame(){const l=state(),r=run();return l.frame<0?{...r.frames[0],labels:Array(40).fill(-1),sse:null,phase:'选择初始中心'}:r.frames[Math.min(l.frame,r.frames.length-1)];}
  function stable(){return state().frame===run().frames.length-1;}
  function stop(){clearInterval(timer);timer=null;}
  function dispose(){stop();view?.dispose();view=null;}
  function enter(step){const l=state();if(step>(student().completed[2]?3:KM.labProgress(student()).available))return;stop();l.step=step;l.frame=-1;l.axes=[0,1,2];l.selected=9;l.params={...KM.LAB_BASE,dims:step>=2?3:2};if(step===0&&student().records.simulation)l.frame=run().frames.length-1;save();io.render();}
  function opts(list,value){return '<option value="">请选择</option>'+list.map(([v,t])=>`<option value="${v}" ${String(value)===String(v)?'selected':''}>${t}</option>`).join('');}
  function guideHtml(){
    const l=state(),r=run(),f=frame(),sim=l.simulation;
    if(l.step!==0)return `<div class="soft"><b>本次只改变：${['','特征维数','初始中心','K'][l.step]}</b><p class="small" style="margin-top:8px">${['','固定 K=3、起点 1、标准化；依次保存 2、3、5 维结果。','固定三维、标准化、K=3；保存另一组起点的结果。','固定三维、标准化、起点 1；保存另一 K 的结果，再看肘部图。'][l.step]}</p></div>`;
    if(student().records.simulation)return '<div class="success"><b>✓ 已完成过程模拟</b><p class="small" style="margin:8px 0 0">可进入下一任务，或重播观察。</p></div>';
    const controls=l.frame===-1?`<label for="simAnswer">比较下表距离：T10 属于哪组？</label><select id="simAnswer" data-lab-field="cluster">${opts([[0,'组 A'],[1,'组 B'],[2,'组 C']],sim.cluster)}</select>`:
      l.frame===0?`<label for="simAnswer">新质心怎样计算？</label><select id="simAnswer" data-lab-field="updateRule">${opts([['mean','同组各点每一维分别求平均'],['sample','选一个离原中心最远的样本']],sim.updateRule)}</select>`:
      l.frame===1?`<label for="simAnswer">中心移动后，成员怎么办？</label><select id="simAnswer" data-lab-field="reassignRule">${opts([['nearest','重新比较到所有新中心的距离'],['keep','保持原分组直到结束']],sim.reassignRule)}</select>`:
      stable()?`<label for="stopRule">为什么可以停止？</label><select id="stopRule" data-lab-field="stopRule">${opts([['both','成员归属与各维质心都已稳定'],['sse','只要显示的 SSE 两位小数一样'],['once','只要更新过一次均值']],sim.stopRule)}</select>`:
      '<p class="small">继续更新、重新分配，观察成员与中心是否稳定。</p>';
    return `<div class="simulation-prompt"><h4>${l.frame<0?'① 分配给最近的中心':l.frame===0?'② 用均值更新中心':l.frame===1?'③ 按新中心重新分配':stable()?'④ 判断停止条件':'继续迭代'}</h4>${controls}<div id="simFeedback" class="small" role="status"></div></div>`;
  }
  function controlsHtml(){const l=state(),done=student().records.simulation,locked=l.step===0&&!done;return `<div class="lab-actions">
    <button class="primary" data-lab-action="step" ${stable()?'disabled':''}>${l.frame<0?'执行首次分配':run().frames[l.frame+1]?.phase==='均值更新'?'执行均值更新':'执行重新分配'}</button>
    <button data-lab-action="play" ${locked&&l.frame<2||stable()?'disabled':''}>连续观察 / 暂停</button>
    ${l.step>0?'<button data-lab-action="finish">运行至稳定</button>':''}
    <button class="ghost" data-lab-action="reset">从起点重看</button>
    <button data-lab-action="save" ${!stable()?'disabled':''}>${l.step===0?'保存过程证据':'保存本次实验'}</button>
  </div>`;}
  function comparisonHtml(){const l=state(),e=student().experiments;
    if(l.step===1){const a=e.find(x=>x.dims===2&&x.k===3&&x.seed===1&&x.mode==='zscore'),b=e.findLast(x=>x.dims===5&&x.k===3&&x.seed===1&&x.mode==='zscore');return `<section class="card"><h3>多一维，距离多一项</h3><div class="formula">二维：d²＝Δ氨氮²＋Δ叶绿素 a²<br>三维：d²＝Δ氨氮²＋Δ叶绿素 a²＋Δ总磷²<br>五维：d²＝前三项＋Δ溶解氧²＋ΔpH²</div><p>Δ 为标准化坐标差；均值仍逐维计算。</p>${a&&b?`<div class="success">同 K、同起点的二维与五维：<b>${KM.samePartition(a.labels,b.labels)?'成员组合相同':'成员组合发生变化'}</b>。</div>`:'<p class="muted">保存后比较成员组合。</p>'}<p class="small muted" style="margin-top:12px">不同维数的 SSE 不直接比优劣。</p></section>`;}
    if(l.step===2){const a=e.find(x=>x.dims===3&&x.k===3&&x.seed===1&&x.mode==='zscore'),b=e.findLast(x=>x.dims===3&&x.k===3&&x.seed!==1&&x.mode==='zscore');return `<section class="card"><h3>比较成员与 SSE</h3>${a&&b?`<div class="info-pair"><div class="metric">起点 ${a.seed}<div class="value">${fmt(a.sse)}</div><span class="small">最终 SSE</span></div><div class="metric">起点 ${b.seed}<div class="value">${fmt(b.sse)}</div><span class="small">最终 SSE</span></div></div><p style="margin-top:12px">本次成员组合${KM.samePartition(a.labels,b.labels)?'相同':'不同'}（已排除编号互换）。</p>`:'<p class="muted">保存另一组起点后对比。</p>'}<label for="observation">换起点后，结果如何？</label><textarea id="observation" data-lab-field="observation" maxlength="1000" placeholder="成员组合与 SSE 有何变化？至少 8 字。">${esc(io.read().draft.observation||'')}</textarea><p class="small muted">结果可能相同或不同；多次运行也不保证全局最优。</p></section>`;}
    if(l.step===3){const curve=student().records.elbow?.dims===3&&student().records.elbow.mode==='zscore'?student().records.elbow.curve:null;return `<section class="card"><div class="row between"><h3>读肘部图，提出 K</h3><button class="primary" data-lab-action="elbow">生成肘部图</button></div><p class="small muted">找 SSE 下降趋缓的位置；SSE 最小不等于 K 最合适。</p><details><summary>肘部图怎样计算？</summary><p>固定三维、标准化；K=2—6 各试 30 个起点，取最小 SSE。</p></details><div class="grid2"><canvas id="elbowPlot" class="chart small-chart" aria-label="K与SSE的肘部关系图"></canvas><div id="elbowTable">${curve?`<table><thead><tr><th>K</th><th>SSE</th><th>比前一 K 下降</th></tr></thead><tbody>${curve.map((c,i)=>`<tr><td>${c.k}</td><td>${fmt(c.sse)}</td><td>${i?fmt(curve[i-1].sse-c.sse):'—'}</td></tr>`).join('')}</tbody></table>`:'生成后比较相邻 K 的下降量。'}</div></div><form data-form="proposal"><label for="chosenK">我的候选 K</label><select id="chosenK" name="k">${[2,3,4,5,6].map(k=>`<option ${Number(io.read().draft.k||3)===k?'selected':''}>${k}</option>`).join('')}</select><label for="reason" style="margin-top:14px">K 的依据</label><textarea id="reason" name="reason" maxlength="1000" required placeholder="引用 SSE 下降量，说明取舍（至少 12 字）；无明显拐点也可说明。">${esc(io.read().draft.reason||'')}</textarea><label for="observation" style="margin-top:14px">起点观察（已带入，可修改）</label><textarea id="observation" name="observation" maxlength="1000" required>${esc(io.read().draft.observation||'')}</textarea><button class="primary" style="margin-top:14px" ${student().completed[2]?'disabled':''}>${student().completed[2]?'✓ 分群建议已提交':'提交我的实验结论'}</button><div id="stageFeedback" class="answer-feedback" role="status"></div></form><details style="margin-top:16px"><summary>国标五类为什么不决定 K=5？</summary><p>国标按规定指标与限值评价，聚类依据所选特征的距离发现结构；簇数不等于水质等级数，K=5 也不能将五个簇直接对应五类水。叶绿素 a 不是 GB 3838 基本项目的 I—V 类分级指标。</p></details></section>`;}

  if(options.links)points.forEach((p,i)=>{const j=labels[i];if(j<0||!centers[j])return;ctx.strokeStyle=colors[j]+'45';ctx.beginPath();ctx.moveTo(X(p[0]),Y(p[1]));ctx.lineTo(X(centers[j][0]),Y(centers[j][1]));ctx.stroke();});
  chartPositions[id]=[];
  points.forEach((p,i)=>{const j=labels?.[i]??-1,x=X(p[0]),y=Y(p[1]);ctx.fillStyle=j>=0?colors[j]:'#8d9f95';ctx.beginPath();ctx.arc(x,y,options.hand?5.5:5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();chartPositions[id].push({x,y,i});if(options.hand){ctx.textAlign='left';ctx.fillStyle='#3b4f46';ctx.fillText('P'+(i+1),x+8,y+(i%2?11:-7));}});
  centers.forEach((p,j)=>{const x=X(p[0]),y=Y(p[1]);ctx.fillStyle='#fff';ctx.strokeStyle=colors[j];ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x,y-9);ctx.lineTo(x+9,y);ctx.lineTo(x,y+9);ctx.lineTo(x-9,y);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=colors[j];ctx.textAlign='center';ctx.fillText('ABCDEF'[j],x,y-13);});
  ctx.fillStyle='#60776a';ctx.textAlign='center';ctx.fillText(options.hand?'x：氨氮教学坐标':`氨氮${expParams.mode==='zscore'?'（标准化）':' mg/L'}`,left+pw/2,h-5);ctx.textAlign='left';ctx.fillText(options.hand?'y：叶绿素 a 教学坐标':`叶绿素 a${expParams.mode==='zscore'?'（标准化）':' μg/L'}`,5,12);
}
function lineChart(id,values,xLabels,label){const setup=canvasSetup(id);if(!setup)return;const {ctx,w,h}=setup;if(!values?.length){ctx.fillStyle='#7e9084';ctx.fillText('等待实验数据',20,h/2);return;}const l=48,t=20,pw=w-68,ph=h-54,max=Math.max(...values,1)*1.1;ctx.font='10px Microsoft YaHei';for(let i=0;i<=3;i++){const y=t+ph-i/3*ph;ctx.strokeStyle='#e3e9e1';ctx.beginPath();ctx.moveTo(l,y);ctx.lineTo(l+pw,y);ctx.stroke();ctx.fillStyle='#718578';ctx.textAlign='right';ctx.fillText(fmt(max*i/3,1),l-6,y+4);}ctx.strokeStyle='#145d58';ctx.lineWidth=2;ctx.beginPath();values.forEach((v,i)=>{const x=l+i*pw/Math.max(1,values.length-1),y=t+ph-v/max*ph;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();values.forEach((v,i)=>{const x=l+i*pw/Math.max(1,values.length-1),y=t+ph-v/max*ph;ctx.fillStyle='#145d58';ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();ctx.textAlign='center';if(values.length<8||i===0||i===values.length-1)ctx.fillText(xLabels[i],x,t+ph+18);});ctx.fillStyle='#718578';ctx.textAlign='left';ctx.fillText(label||'SSE',5,12);}
function barChart(id,labels,values,max){const setup=canvasSetup(id);if(!setup)return;const {ctx,w,h}=setup,l=26,t=22,pw=w-38,ph=h-62;max=max||Math.max(...values,1);labels.forEach((name,i)=>{const bw=pw/labels.length*.48,x=l+pw/labels.length*(i+.26),v=values[i]||0,bh=v/max*ph;ctx.fillStyle='#eaf1e8';ctx.fillRect(x,t,bw,ph);ctx.fillStyle=colors[i%colors.length];ctx.fillRect(x,t+ph-bh,bw,bh);ctx.fillStyle='#365247';ctx.textAlign='center';ctx.fillText(fmt(v,1),x+bw/2,t+ph-bh-7);ctx.fillText(name,x+bw/2,t+ph+20);});}
function drawAll(){if(stage===1){drawHand();if(S.student.completed[1])drawHandIteration();}if(stage===2)lab.draw();if(stage===3)drawColor(false);}
function drawHand(){const h=draft.hand;scatter('handPlot',KM.HAND,h.initial.map(i=>KM.HAND[i]),h.labels,{hand:true,links:true});}
function drawHandIteration(){const run=KM.handExpected(draft.hand.initial).run;handFrame=Math.min(handFrame,run.frames.length-1);const f=run.frames[handFrame];scatter('handIteration',KM.HAND,f.centers,f.labels,{hand:true,links:true});$('#handMetrics').innerHTML=`<div class="metric"><div class="label">第 ${f.round} 轮 · ${f.phase}${handFrame===run.frames.length-1?' · 已稳定':''}</div><div class="value">SSE ${fmt(f.sse,4)}</div></div><p class="small" style="margin-top:12px">${f.centers.map((c,j)=>`中心 ${'ABC'[j]} (${fmt(c[0])}, ${fmt(c[1])})`).join('<br>')}</p>`;lineChart('handCurve',run.frames.slice(0,handFrame+1).map(x=>x.sse),run.frames.slice(0,handFrame+1).map((_,i)=>i),'SSE · 半步记录');}

function drawTeacher(){ /* Teacher evidence is accessible HTML, responsive without canvas redraws. */ }
function colorPixels(){const points=[];for(let y=0;y<24;y++)for(let x=0;x<48;x++){const lake=y>10+Math.sin(x/7)*2;points.push(lake?[40+x*2,120+y*2,125+x]:[135+x,175+y,150+y*2]);}return points;}
function drawColor(reduced){const pixels=colorPixels(),result=reduced?KM.run(pixels,5,12):null;for(const [id,use] of [['colorOriginal',false],['colorResult',reduced]]){const canvas=document.getElementById(id);if(!canvas)continue;canvas.width=48;canvas.height=24;const ctx=canvas.getContext('2d');pixels.forEach((p,i)=>{const rgb=use?result.centers[result.labels[i]]:p;ctx.fillStyle=`rgb(${rgb.map(Math.round).join(',')})`;ctx.fillRect(i%48,Math.floor(i/48),1,1);});}if(reduced)$('#colorCaption').textContent='聚成 5 组，每组用均值颜色表示';}
function stopPlay(){if(playTimer)clearInterval(playTimer);playTimer=null;}
function play(kind){if(playTimer)return stopPlay();playTimer=setInterval(()=>{const n=KM.handExpected(draft.hand.initial).run.frames.length;handFrame=Math.min(handFrame+1,n-1);drawHandIteration();if(handFrame===n-1)stopPlay();},850);}
async function submit(stageNum,answer){
  let check;
  if(offline){
    if(S.student.completed[stageNum])return;
    check=KM.recordSubmission(S.student,stageNum,answer);saveDraft();
  }else{
    const result=await request('submit',{stage:stageNum,answer});check=result.check;setState(result);
  }
  if(check.pass||stageNum===1)studentRender();
  const feedback=$('#stageFeedback');
  if(feedback){feedback.className='answer-feedback '+(check.pass||check.centersReady?'success':'error');feedback.textContent=check.message;}
  toast(check.message);
  if(stageNum===3&&check.pass)$('#reflectionFeedback')?.scrollIntoView({behavior:'smooth',block:'start'});
  if(stageNum===1&&answer.phase==='centers')$('#centroidReference')?.scrollIntoView({behavior:'smooth',block:'center'});
}
function download(name,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csv(rows){const cell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};return '\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n');}
async function chat(question){if(chatBusy||!question.trim())return;chatBusy=true;messages[stage].push({user:true,text:question});const currentStage=stage;studentRender();const reply={text:'',source:S.model?'大模型助教':'本地导学'};messages[currentStage].push(reply);const area=$('#chatMessages');area.insertAdjacentHTML('beforeend','<div class="bubble" id="liveReply">正在思考你的问题…</div>');try{if(offline){S.student.hints[currentStage]++;reply.text=KM.tutor(currentStage,question,S.student).slice(0,120);}else{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({stage:currentStage,message:question})});if(!response.ok){const data=await response.json();throw Error(data.error);}const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const blocks=buffer.split('\n\n');buffer=blocks.pop();for(const block of blocks){const line=block.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const obj=JSON.parse(line.slice(6));if(obj.source)reply.source=obj.source+(obj.fallback?'（模型暂不可用，已切换）':'');if(obj.delta)reply.text+=obj.delta;if($('#liveReply'))$('#liveReply').textContent=reply.text||'正在准备提示…';area.scrollTop=area.scrollHeight;}}}}catch(e){reply.text=e.message;reply.source='提示';}finally{chatBusy=false;saveDraft();studentRender();$('#chatMessages').scrollTop=$('#chatMessages').scrollHeight;}}
document.addEventListener('submit',async ev=>{const form=ev.target;if(!form.dataset.form)return;ev.preventDefault();const button=form.querySelector('button[type=submit],button:not([type])');if(button)button.disabled=true;const f=Object.fromEntries(new FormData(form));try{switch(form.dataset.form){
  case 'join':if(offline){S={student:{...KM.freshStudent(f.name,f.group),id:'offline'},room:{code:'离线',unlock:0},model:false};put('taihu-offline',S);}else{const result=await request('join',f);token=result.token;put('taihu-token',token);S=result;}initDraft();studentRender();startPoll();break;
  case 'concept':draft.choice=f.choice;await submit(0,{choice:f.choice});break;
  case 'hand-centers':draft.hand.fresh=false;await submit(1,{...draft.hand,phase:'centers'});break;
  case 'hand-sse':await submit(1,{...draft.hand,phase:'sse'});break;
  case 'proposal':draft={...draft,...f};await submit(2,{k:Number(f.k),reason:f.reason,observation:f.observation});break;
  case 'exit':await submit(3,{version:2,transfer:f.transfer,application:f.application,focus:f.focus,note:f.note||''});break;
  case 'chat':await chat(f.message);break;
  case 'teacher-login':{const r=await request('teacher/login',f);token=r.token;sessionStorage.setItem('taihu-teacher',token);await loadTeacher();startPoll();break;}
  case 'create-class':{const r=await request('teacher/create',f);selectedRoom=r.room.code;sessionStorage.setItem('taihu-room',selectedRoom);await loadTeacher();break;}
  case 'review':await request('teacher/review',{id:form.dataset.id,levels:[0,1,2,3].map(i=>f['level'+i]?Number(f['level'+i]):null),comment:f.comment});toast('教师复核已保存，学生端可查看。');break;
  case 'model':await request('teacher/model',{baseUrl:f.baseUrl,model:f.model,...(f.key?{key:f.key}:{})});toast('设置已保存，请测试连接。');await loadTeacher();break;
}}catch(e){toast(e.message);const el=$('#joinFeedback')||$('#loginFeedback');if(el){el.className='answer-feedback error';el.textContent=e.message;}}finally{if(button&&button.isConnected)button.disabled=false;saveDraft();}});
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;const act=b.dataset.action;try{switch(act){
  case 'stage':{const next=Number(b.dataset.stage);if(next>KM.allowed(S.student,S.room))return;stage=next;studentRender();window.scrollTo({top:0,behavior:'smooth'});break;}
  case 'toggle-tutor':collapsed=!collapsed;studentRender();break;
  case 'scale-predict':case 'scale-unit':case 'scale-method':case 'scale-done':{
    const a=draft.scaleDemo||={unit:'mg',scaled:false};let focus;
    if(act==='scale-predict'){a.prediction=b.dataset.value;focus='#scaleUnitToggle';}
    if(act==='scale-unit'){a.unit=a.unit==='mg'?'ug':'mg';if(a.scaled)a.verified=true;else a.converted=true;focus='#scaleUnitToggle';}
    if(act==='scale-method'){a.scaled=!a.scaled;focus='#scaleMethodToggle';}
    if(act==='scale-done'){a.done=true;focus='#scaleActivity summary';}
    saveDraft();$('#scaleActivityHost').innerHTML=scaleActivityHtml();$(focus)?.focus({preventScroll:true});break;
  }
  case 'logout':if(!offline)await request('logout',{});token=null;put('taihu-token',null);S=null;clearInterval(pollTimer);landing();break;
  case 'choose-center':selectingCenter=Number(b.dataset.index);centerArmed=true;studentRender();toast('请点击一个样本点，将它设为所选初始中心。');break;
  case 'reset-hand':draft.hand={fresh:true,initial:KM.HAND_INIT.slice(),labels:Array(8).fill(-1),centers:[['',''],['',''],['','']],sse:''};studentRender();break;
  case 'hand-step':stopPlay();handFrame=Math.min(handFrame+1,KM.handExpected(draft.hand.initial).run.frames.length-1);drawHandIteration();break;
  case 'hand-reset':stopPlay();handFrame=0;drawHandIteration();break;
  case 'hand-play':play('hand');break;
  case 'export-data':download('40点模拟数据.csv',csv([['点位',...KM.FEATURES.map(f=>f.name+' '+f.unit),'来源'],...KM.DATA.map(r=>[r.id,...r.values,'教学模拟，非实测'])]),'text/csv;charset=utf-8');break;
  case 'export-mine':download('我的学习记录.json',JSON.stringify(S.student,null,2));break;
  case 'model-feedback':{b.disabled=true;toast('正在依据过程证据生成补充点评…');const result=await request('feedback',{});setState(result);studentRender();toast(result.modelReview?'AI 点评已生成，供教师复核。':result.message);break;}
  case 'color':drawColor(true);break;
  case 'quick-chat':await chat(b.dataset.question);break;
  case 'teacher-local':{const r=await request('teacher/login',{local:true});token=r.token;sessionStorage.setItem('taihu-teacher',token);await loadTeacher();startPoll();break;}
  case 'teacher-logout':await request('logout',{});token=null;sessionStorage.removeItem('taihu-teacher');clearInterval(pollTimer);teacherLogin();break;
  case 'projector':projector=!projector;teacherRender();break;
  case 'unlock':await request('teacher/control',{code:selectedRoom,unlock:Number(b.dataset.stage)});await loadTeacher();toast('已开放访问；学生的完成记录保持真实。');break;
  case 'pause':await request('teacher/control',{code:selectedRoom,paused:!teacherData.room.paused});await loadTeacher();break;
  case 'refresh-teacher':await loadTeacher();break;
  case 'delete-student':{
    const s=teacherData?.students?.find(s=>s.id===b.dataset.id),code=selectedRoom;
    if(!s||teacherDeleting)break;
    const description=`“${s.name}”（第 ${s.group} 组，已完成 ${s.completed.filter(Boolean).length}/4 环节，K=${s.records[2]?.k||'—'}）`;
    if(!window.confirm(`删除${description}的记录？\n\n该条记录的作答、实验和教师复核将一并删除，班级统计与导出同步更新。删除后无法撤销。`))break;
    const openRecords=$$('.record-item[open]').map(el=>el.dataset.record);
    const edits=$$('form[data-form="review"]').map(form=>({id:form.dataset.id,values:Object.fromEntries(new FormData(form))}));
    teacherDeleting=true;++teacherLoadVersion;b.disabled=true;
    try{
      await request('teacher/delete-student',{id:s.id,code});
      if(selectedRoom===code){
        teacherData.students=teacherData.students.filter(student=>student.id!==s.id);teacherRender();
        $$('.record-item').forEach(el=>{el.open=openRecords.includes(el.dataset.record);});
        $$('form[data-form="review"]').forEach(form=>{const edit=edits.find(x=>x.id===form.dataset.id);if(edit)for(const [name,value] of Object.entries(edit.values))if(form.elements.namedItem(name))form.elements.namedItem(name).value=value;});
        $('[data-action="refresh-teacher"]')?.focus({preventScroll:true});
      }
      toast(`已删除“${s.name}”的记录。`);
    }finally{teacherDeleting=false;if(b.isConnected)b.disabled=false;}
    break;
  }
  case 'copy-link':{const link=(teacherData.addresses?.[0]||location.origin)+'/?class='+selectedRoom;try{await navigator.clipboard.writeText(link);toast('学生链接已复制');}catch{window.prompt('复制学生链接',link);}break;}
  case 'export-class':case 'export-json':{const json=act==='export-json';const response=await fetch('/api/teacher/export?code='+selectedRoom+(json?'&format=json':''),{headers:{Authorization:'Bearer '+token}});if(!response.ok)throw Error('导出未完成，请刷新后重试');download('课堂记录.'+(json?'json':'csv'),await response.text(),json?'application/json':'text/csv;charset=utf-8');break;}
  case 'test-model':b.disabled=true;toast('正在测试模型连接…');const test=await request('teacher/model-test',{});toast(test.message);b.disabled=false;break;
}}catch(e){toast(e.message);b.disabled=false;}});
document.addEventListener('input',ev=>{const el=ev.target;if(!S||teacherView)return;if(el.dataset.center){const [j,d]=el.dataset.center.split(',').map(Number);draft.hand.centers[j][d]=el.value;refreshHandReady();}else if(el.id==='pointSse')draft.hand.pointSse=el.value;else if(el.id==='sseTrend')draft.hand.trend=el.value;else if(el.dataset.reflection){draft.exitV2[el.dataset.reflection]=el.value;}else if(el.dataset.exit){draft.exit[el.dataset.exit]=el.value;}else if(el.dataset.self){draft.exit.self=draft.exit.self||[];draft.exit.self[Number(el.dataset.self)]=Number(el.value);}else if(['reason','observation'].includes(el.name)&&stage===2)draft[el.name]=el.value;saveDraft();});
document.addEventListener('change',async ev=>{const el=ev.target;try{if(el.dataset.labelIndex!==undefined){draft.hand.labels[Number(el.dataset.labelIndex)]=Number(el.value);saveDraft();drawHand();refreshHandReady();}if(el.name==='choice'){draft.choice=el.value;saveDraft();}if(el.name==='k'&&stage===2){draft.k=Number(el.value);saveDraft();}if(el.dataset.teacherRoom!==undefined){selectedRoom=el.value;sessionStorage.setItem('taihu-room',selectedRoom);await loadTeacher();}}catch(e){toast(e.message);}});
document.addEventListener('click',ev=>{if(ev.target.id!=='handPlot')return;const c=ev.target,r=c.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;const p=(chartPositions[c.id]||[]).find(p=>Math.hypot(p.x-x,p.y-y)<18);if(!p)return;if(c.id==='handPlot'){const h=draft.hand;if((centerArmed||ev.shiftKey)&&!S.student.completed[1]){setInitialPoint(p.i);return;}const d=h.initial.map(i=>KM.distance2(KM.HAND[p.i],KM.HAND[i]));$('#handTooltip').textContent=h.labels[p.i]<0?`P${p.i+1}：请先预测它所属的组，再点击查看距离。按住 Shift 点击可设置选中的初始中心。`:`P${p.i+1} 到 A/B/C 的平方距离：${d.map(n=>fmt(n,4)).join(' / ')}。你的预测是组 ${'ABC'[h.labels[p.i]]}。`;}});
function setInitialPoint(i){if(draft.hand.initial.includes(i)&&draft.hand.initial[selectingCenter]!==i){toast('三个初始质心请选择不同的点。');return;}centerArmed=false;draft.hand.initial[selectingCenter]=i;draft.hand.labels=Array(8).fill(-1);draft.hand.centers=[['',''],['',''],['','']];draft.hand.sse='';draft.hand.pointSse='';draft.hand.trend='';draft.hand.fresh=true;studentRender();toast(`中心 ${'ABC'[selectingCenter]} 已设置为 P${i+1}`);}
let dragCenter=null;
document.addEventListener('pointerdown',ev=>{if(ev.target.id!=='handPlot'||S.student.completed[1])return;const r=ev.target.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;const p=chartPositions.handPlot.find(p=>Math.hypot(p.x-x,p.y-y)<15&&draft.hand.initial.includes(p.i));if(p){dragCenter={j:draft.hand.initial.indexOf(p.i),x:ev.clientX,y:ev.clientY};ev.target.setPointerCapture(ev.pointerId);}});
document.addEventListener('pointerup',ev=>{if(!dragCenter)return;const drag=dragCenter;dragCenter=null;if(Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)<5)return;const r=ev.target.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;const p=chartPositions.handPlot.find(p=>Math.hypot(p.x-x,p.y-y)<22);if(p){selectingCenter=drag.j;setInitialPoint(p.i);}});
function startPoll(){clearInterval(pollTimer);if(offline)return;pollTimer=setInterval(async()=>{if(document.hidden)return;try{if(teacherView){if(!token||teacherDeleting||document.querySelector('.record-item[open], .class-evidence details[open]')||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;await loadTeacher();}else if(S){const r=await request('me');if(S.student.attempts.some((n,i)=>n>r.student.attempts[i])||S.student.completed.some((done,i)=>done&&!r.student.completed[i])||S.student.experiments.length>r.student.experiments.length)return;const changed=r.room.unlock!==S.room.unlock||r.room.paused!==S.room.paused||JSON.stringify(r.student.review)!==JSON.stringify(S.student.review)||r.model!==S.model;S={...S,...r};if(changed&&!chatBusy){studentRender();toast('课堂状态已更新');}}}catch{/* retain drafts when temporarily offline; mutations display explicit errors */}},4000);}
window.addEventListener('resize',()=>{clearTimeout(window.resizeTimer);window.resizeTimer=setTimeout(()=>teacherView?drawTeacher():S&&drawAll(),150);});
async function boot(){if(teacherView){if(offline)return teacherLogin();if(token){try{await loadTeacher();startPoll();return;}catch{token=null;}}teacherLogin();return;}if(offline){S=get('taihu-offline',null);if(S){initDraft();studentRender();return;}landing();return;}if(token){try{S=await request('me');initDraft();studentRender();startPoll();return;}catch{token=null;put('taihu-token',null);}}landing();}
const lab=ClassroomLab.create({read:()=>({student:S.student,room:S.room,draft}),save:saveDraft,post:request,set:setState,render:studentRender,toast,offline,lineChart,experimentTable});
